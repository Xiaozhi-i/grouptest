<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孤鸿组 - 近期活动</title>
    <style>
        @font-face { font-family: 'MengyuanSong'; src: url('fonts/梦源宋体-W27.ttf'); }
        @font-face { font-family: 'FZHei'; src: url('fonts/方正黑体简体.ttf'); }
        @font-face { font-family: 'FZShuSong'; src: url('fonts/方正书宋简体.ttf'); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'FZShuSong', sans-serif; min-height: 100vh;
            background-color: #f4f7f9; background-image: url('bg.jpg');
            background-repeat: no-repeat; background-position: center center;
            background-size: cover; background-attachment: fixed; color: #000000; overflow-x: hidden;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(255, 255, 255, 0.3); border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8); border-top: none;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255,255,255,0.8); 
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { height: 30px; width: 30px; border-radius: 50%; object-fit: cover; }
        .logo-text { font-family: 'MengyuanSong', serif; font-size: 24px; color: #16375D; font-weight: 400; }
        .page-title { font-family: 'FZHei', sans-serif; font-size: 16px; color: #000; opacity: 0.8; }

        /* 活动列表卡片样式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.03);    
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
            cursor: pointer; color: inherit; display: block;
        }
        .glass-card:hover { background: rgba(255, 255, 255, 0.35); transform: translateY(-5px); }
        .glass-card:active { transform: scale(0.96); } 

        .card-title { 
            font-family: 'FZHei', sans-serif; font-size: 20px; margin-bottom: 10px; color: #16375D; 
            display: flex; align-items: center; gap: 10px;
        }
        .card-content { font-family: 'FZShuSong', serif; font-size: 16px; color: #000; line-height: 1.6; }
        
        /* 活动时间标签 */
        .activity-time {
            display: inline-block; margin-top: 12px; padding: 4px 12px;
            background: rgba(22, 55, 93, 0.1); border-radius: 12px;
            font-family: 'FZHei', sans-serif; font-size: 14px; color: #16375D;
        }

        /* 【新增】：测试提示语专属样式 */
        .test-notice {
            text-align: center; padding: 20px; margin-bottom: 30px;
            font-family: 'FZHei', sans-serif; font-size: 16px; color: #16375D;
            background: rgba(255, 255, 255, 0.4); border-radius: 16px;
            border: 1px dashed rgba(22, 55, 93, 0.3);
        }

        footer {
            text-align: center; padding: 30px; margin-top: 40px;
            font-family: 'FZShuSong', serif; font-size: 14px; color: #000;
            backdrop-filter: blur(10px); background: rgba(255,255,255,0.2);
        }
        footer a { color: #16375D; text-decoration: none; margin: 0 5px; }
        footer a:hover { text-decoration: underline; }
        .icon-svg { width: 24px; height: 24px; fill: none; stroke: #16375D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <img src="logo.png" alt="组徽" onerror="this.style.display='none'">
            <span class="logo-text">孤鸿组</span>
        </div>
        <div class="page-title">近期活动</div>
    </header>

    <main style="padding: 100px 20px 40px; max-width: 900px; margin: auto;">
        
        <!-- 【修复】：用户可见的测试提示 -->
        <div class="test-notice">
            💡 提示：本处仅为测试画面，后续将替换为真实活动数据
        </div>

        <!-- 示例活动 1 -->
        <div class="glass-card">
            <div class="card-title">
                <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                秋季校园运动会
            </div>
            <div class="card-content">
                孤鸿组全体同学需积极参与，展现班级风采。请提前准备好运动鞋和饮用水。
            </div>
            <span class="activity-time"> 2026年10月15日 - 10月17日</span>
        </div>

        <!-- 示例活动 2 -->
        <div class="glass-card">
            <div class="card-title">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                孤鸿组期中学习经验分享会
            </div>
            <div class="card-content">
                邀请组内各科优秀代表分享复习方法和错题本使用技巧，地点在班级多媒体教室。
            </div>
            <span class="activity-time"> 2026年11月5日 16:30 - 17:30</span>
        </div>

        <!-- 示例活动 3 -->
        <div class="glass-card">
            <div class="card-title">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                班级黑板报更新
            </div>
            <div class="card-content">
                本期主题为“冲刺期末”，欢迎有绘画和书法特长的同学课后留下协助排版。
            </div>
            <span class="activity-time"> 即日起至 2026年12月1日</span>
        </div>
    </main>

    <footer>
        <p>千问提供技术支持 &copy; 2026 孤鸿组</p>
    </footer>
</body>
</html>
